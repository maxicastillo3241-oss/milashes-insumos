<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin | MILASHES INSUMOS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="admin.css">

  <style>
    .catalog-heading { display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
    .catalog-tabs { display:flex; gap:6px; }
    .catalog-tab { border:1px solid #e9e1e4; background:#fff; padding:8px 12px; font-size:9px; font-weight:700; letter-spacing:.6px; cursor:pointer; }
    .catalog-tab.active { background:#292327; color:#fff; border-color:#292327; }
    .product-tags { display:flex; gap:5px; flex-wrap:wrap; margin-top:6px; }
    .admin-tag { display:inline-block; padding:3px 6px; font-size:8px; font-weight:700; letter-spacing:.5px; }
    .admin-tag.offer { background:#f9edf1; color:#b86683; }
    .admin-tag.featured { background:#292327; color:#fff; }
    .checkbox-group { display:flex; flex-direction:column; gap:10px; }
  </style>
</head>

<body>

  <!-- LOGIN -->

  <section class="login-screen" id="loginScreen">

    <div class="login-box">

      <div class="admin-logo">
        <span>MILASHES</span>
        <small>INSUMOS</small>
      </div>

      <h1>Administración</h1>

      <p class="login-description">
        Ingresá para administrar tus productos.
      </p>

      <form id="loginForm">

        <label>Email</label>

        <input
          type="email"
          id="loginEmail"
          placeholder="Tu email"
          required
        >

        <label>Contraseña</label>

        <input
          type="password"
          id="loginPassword"
          placeholder="Tu contraseña"
          required
        >

        <button type="submit" class="primary-button">
          INGRESAR
        </button>

        <p class="login-error" id="loginError"></p>

      </form>

      <a href="index.html" class="back-store">
        ← Volver a la tienda
      </a>

    </div>

  </section>


  <!-- ADMIN -->

  <section class="admin-screen" id="adminScreen">

    <header class="admin-header">

      <div class="admin-brand">

        <div>
          <span>MILASHES</span>
          <small>INSUMOS</small>
        </div>

        <label>ADMIN</label>

      </div>

      <div class="header-actions">

        <a href="index.html" target="_blank">
          Ver tienda
        </a>

        <button id="logoutButton">
          Cerrar sesión
        </button>

      </div>

    </header>


    <main class="admin-container">

      <div class="page-title">

        <div>
          <span>ADMINISTRACIÓN</span>
          <h1>Productos</h1>
        </div>

        <button
          class="primary-button"
          id="newProductButton"
        >
          + NUEVO PRODUCTO
        </button>

      </div>


      <!-- ESTADÍSTICAS -->

      <div class="stats">

        <div class="stat-card">

          <span>PRODUCTOS</span>

          <strong id="totalProducts">
            0
          </strong>

        </div>

        <div class="stat-card">

          <span>ACTIVOS</span>

          <strong id="activeProducts">
            0
          </strong>

        </div>

        <div class="stat-card">

          <span>CATEGORÍAS</span>

          <strong id="totalCategories">
            0
          </strong>

        </div>

      </div>


      <!-- PRODUCTOS -->

      <section class="products-admin">

        <div class="products-admin-header">

          <div class="catalog-heading">
            <h2>Catálogo</h2>
            <div class="catalog-tabs" id="catalogTabs">
              <button type="button" class="catalog-tab active" data-view="all">Todos</button>
              <button type="button" class="catalog-tab" data-view="offers">Ofertas</button>
              <button type="button" class="catalog-tab" data-view="featured">Destacados</button>
            </div>
          </div>

          <input
            type="search"
            id="adminSearch"
            placeholder="Buscar producto..."
          >

        </div>

        <div id="productsList"></div>

      </section>

    </main>


    <!-- MODAL PRODUCTO -->

    <div class="modal" id="productModal">

      <div class="modal-box">

        <div class="modal-header">

          <div>

            <span>PRODUCTO</span>

            <h2 id="modalTitle">
              Nuevo producto
            </h2>

          </div>

          <button
            class="close-modal"
            id="closeModal"
          >
            ×
          </button>

        </div>


        <form id="productForm">

          <input
            type="hidden"
            id="productId"
          >


          <div class="form-grid">

            <div class="form-group full">

              <label>
                Nombre del producto
              </label>

              <input
                type="text"
                id="productName"
                required
                placeholder="Ej: Pestañas Clásicas 0.15 C"
              >

            </div>


            <div class="form-group">

              <label>
                Categoría
              </label>

              <select id="productCategory" required>

                <option value="">
                  Seleccionar
                </option>

                <option value="Pestañas">
                  Pestañas
                </option>

                <option value="Adhesivos">
                  Adhesivos
                </option>

                <option value="Pinzas">
                  Pinzas
                </option>

                <option value="Accesorios">
                  Accesorios
                </option>

                <option value="Kits">
                  Kits
                </option>

              </select>

            </div>


            <div class="form-group">

              <label>
                Precio
              </label>

              <input
                type="number"
                id="productPrice"
                min="0"
                required
                placeholder="8500"
              >

            </div>


            <div class="form-group">

              <label>
                Precio transferencia
              </label>

              <input
                type="number"
                id="productTransferPrice"
                min="0"
                required
                placeholder="7650"
              >

            </div>


            <div class="form-group">

              <label>
                Stock
              </label>

              <input
                type="number"
                id="productStock"
                min="0"
                step="1"
                value="0"
                required
                placeholder="10"
              >

            </div>


            <div class="form-group">

              <label>
                Descuento %
              </label>

              <input
                type="number"
                id="productDiscount"
                min="0"
                max="100"
                value="0"
              >

            </div>


            <div class="form-group full">

              <label>
                URL de imagen
              </label>

              <input
                type="url"
                id="productImage"
                placeholder="https://..."
              >

              <small>
                Por ahora podés pegar directamente la URL de la imagen.
              </small>

            </div>


            <div class="form-group full">

              <label>
                Descripción
              </label>

              <textarea
                id="productDescription"
                rows="5"
                placeholder="Descripción del producto..."
              ></textarea>

            </div>


            <div class="form-group checkbox-group full">

              <label>

                <input
                  type="checkbox"
                  id="productOffer"
                >

                Mostrar en Ofertas

              </label>

              <label>

                <input
                  type="checkbox"
                  id="productActive"
                  checked
                >

                Producto activo

              </label>

            </div>

          </div>


          <div class="form-actions">

            <button
              type="button"
              class="secondary-button"
              id="cancelProduct"
            >
              CANCELAR
            </button>

            <button
              type="submit"
              class="primary-button"
              id="saveProduct"
            >
              GUARDAR PRODUCTO
            </button>

          </div>

          <p id="formMessage"></p>

        </form>

      </div>

    </div>


    <!-- TOAST -->

    <div class="toast" id="toast"></div>

  </section>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="admin.js"></script>

</body>
</html>
